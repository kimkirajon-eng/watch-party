<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Watch Party - Oda</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .room-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      height: calc(100vh - 80px);
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
    }
    .video-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    #player {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #player iframe {
      width: 100%; height: 100%;
      border: none;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .controls input {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a2e;
      color: #fff;
      font-size: 14px;
    }
    .controls input::placeholder { color: #666; }
    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      background: #1a1a2e;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .volume-control svg { flex-shrink: 0; opacity: 0.5; }
    .volume-control input[type="range"] {
      width: 80px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #333;
      border-radius: 2px;
      outline: none;
      border: none;
      padding: 0;
      min-width: auto;
    }
    .volume-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
    }
    .volume-control input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      border: none;
    }
    .volume-label {
      font-size: 12px;
      color: #888;
      min-width: 32px;
      text-align: right;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      padding: 16px;
      border-radius: 12px;
      background: #16213e;
    }
    .card h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .user-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .user-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #1a1a2e;
      font-size: 14px;
    }
    .user-list li:last-child { border-bottom: none; }
    .user-status {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    .room-info {
      font-size: 12px;
      color: #666;
      word-break: break-all;
    }
    .room-info code {
      background: #1a1a2e;
      padding: 2px 6px;
      border-radius: 4px;
      color: #888;
      font-size: 12px;
    }
    .voice-card {
      flex: 1;
      min-height: 200px;
    }
    #voiceContainer {
      width: 100%;
      height: 100%;
      min-height: 200px;
      border-radius: 8px;
      overflow: hidden;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 200px;
      color: #555;
      text-align: center;
      gap: 8px;
    }
    .sync-status {
      font-size: 12px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sync-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    .sync-dot.disconnected { background: #ef4444; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .voice-status { font-size: 13px; text-align: center; padding: 0 8px; }
    .voice-status.waiting { color: #666; }
    .voice-status.connecting { color: #fbbf24; }
    .voice-status.connected { color: #22c55e; }
    .voice-status.muted { color: #f97316; }
    .voice-status.disconnected { color: #ef4444; }
    .voice-status.mic-error { color: #ef4444; }
    .btn-mute { transition: all 0.2s; }
    .btn-mute:hover { background: #2a2a4a; }
    .btn-mute.hidden { display: none; }
    .host-badge {
      background: #3b82f6;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-left: auto;
    }
    #leaveBtn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      transition: background 0.2s;
    }
    #leaveBtn:hover { background: #dc2626; }
    @media (max-width: 900px) {
      .room-layout {
        grid-template-columns: 1fr;
        height: auto;
        gap: 12px;
        padding: 12px;
      }
      .sidebar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .voice-card { min-height: 180px; }
    }
    @media (max-width: 600px) {
      .sidebar { grid-template-columns: 1fr; }
      .controls input { min-width: 120px; }
    }
  </style>
</head>
<body>
  <div class="room-layout">
    <div class="video-section">
      <div class="video-wrapper" id="videoWrapper">
        <div class="empty-state" id="emptyVideo">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.4">
            <polygon points="23 7 16 12 23 17 23 7" />
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
          </svg>
          <p>Henüz bir video yüklenmedi</p>
          <p style="font-size:13px">Aşağıdaki kutuya YouTube linkini yapıştırın</p>
        </div>
        <div id="player"></div>
      </div>

      <div class="controls">
        <input type="text" id="videoUrlInput" placeholder="YouTube linkini yapıştır..." />
        <button class="btn btn-primary" id="loadVideoBtn" style="padding:10px 20px;white-space:nowrap">Yükle</button>
        <div class="sync-status">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncLabel">Senkronize</span>
        </div>
        <div class="volume-control">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
          </svg>
          <input type="range" id="volumeSlider" min="0" max="100" value="100" />
          <span class="volume-label" id="volumeLabel">100%</span>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="card">
        <h3>Odadaki Herkes</h3>
        <ul class="user-list" id="userList">
          <li style="color:#555;justify-content:center;padding:20px">Katılımcı bekleniyor...</li>
        </ul>
        <div class="room-info" style="margin-top:12px;padding-top:12px;border-top:1px solid #1a1a2e">
          <p style="margin:0 0 4px 0">Oda Kodu: <code id="roomCodeDisplay"></code></p>
          <p style="margin:0">Link: <code id="roomLinkDisplay"></code></p>
        </div>
        <button id="leaveBtn" style="margin-top:12px">Odadan Ayrıl</button>
      </div>

      <div class="card voice-card">
        <h3>Sesli Sohbet</h3>
        <div id="voiceContainer" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:180px;gap:12px">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.3">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
          <div id="voiceStatus" class="voice-status waiting">Sesli sohbet için diğer kişi bekleniyor...</div>
          <button id="muteBtn" class="btn-mute hidden" style="padding:8px 20px;border-radius:20px;border:1px solid #333;background:#1a1a2e;color:#fff;cursor:pointer;font-size:13px">Sesi Kapat</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/webrtc.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
